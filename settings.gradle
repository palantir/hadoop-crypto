buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.82.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'hadoop-crypto-root'

include 'crypto-core'
include 'apache-crypto'
include 'crypto-keys'
include 'hadoop-crypto'
